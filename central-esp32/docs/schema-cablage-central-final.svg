<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
  <title id="title">Câblage minimal du monnayeur JY-133B vers la centrale ESP32</title>
  <desc id="desc">Montage pour une sortie COIN à collecteur ouvert vers GND ou une interface compatible 0 à 3,3 volts vérifiée. Le monnayeur est alimenté en 12 volts. Sa sortie COIN est reliée au GPIO13 de l'ESP32, configuré en INPUT_PULLUP avec rappel interne vers 3V3. Aucune résistance externe vers GND. Une sortie à tension plus élevée nécessite une interface adaptée. L'ESP32 est alimenté séparément par USB.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#edf2f7"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1678ad"/><stop offset="1" stop-color="#074d78"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f6f8"/><stop offset="1" stop-color="#b9c4cd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#26384b" flood-opacity=".22"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172536}.subtitle{font:18px Arial,sans-serif;fill:#53677d}.section{font:700 21px Arial,sans-serif;fill:#172536}.label{font:700 16px Arial,sans-serif;fill:#182635}.small{font:14px Arial,sans-serif;fill:#53677d}.tiny{font:12px Arial,sans-serif;fill:#66798d}.white{fill:#fff}.silk{font:12px Arial,sans-serif;fill:#e7edf3}.port{stroke:#13202c;stroke-width:2}.wire{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.wire12{stroke:#e83b3b}.wireGnd{stroke:#20262c}.wireCoin{stroke:#31a8dc}.junction{stroke:#fff;stroke-width:2}.callout{fill:#fff;stroke:#c6d1dc;stroke-width:2;rx:14;filter:url(#shadow)}.warning{fill:#fff5d8;stroke:#d89e14;stroke-width:2;rx:13}.warningText{font:700 15px Arial,sans-serif;fill:#775611}
    </style>
  </defs>

  <rect width="1700" height="1050" fill="url(#page)"/>
  <rect x="0" y="0" width="1700" height="112" fill="#fff"/>
  <line x1="0" y1="112" x2="1700" y2="112" stroke="#d6dee7" stroke-width="2"/>
  <text x="50" y="50" class="title">Centrale PS TIME MANAGER — câblage minimal du monnayeur</text>
  <text x="50" y="84" class="subtitle">GPIO13 · INPUT_PULLUP vers 3V3 · sortie COIN compatible 0–3,3 V vérifiée · masse commune</text>

  <!-- Alimentation 12 V du monnayeur -->
  <g filter="url(#shadow)">
    <rect x="45" y="215" width="280" height="470" rx="20" fill="#fff" stroke="#c6d1dc" stroke-width="2"/>
    <rect x="45" y="215" width="280" height="58" rx="20" fill="#34495e"/>
    <rect x="45" y="245" width="280" height="28" fill="#34495e"/>
    <text x="75" y="251" class="white" style="font:700 19px Arial,sans-serif">ALIMENTATION 12 V DC</text>
    <rect x="91" y="332" width="188" height="190" rx="18" fill="#20262c" stroke="#77838d" stroke-width="3"/>
    <rect x="120" y="365" width="130" height="93" rx="9" fill="#f3f5f6" stroke="#9aa6ae" stroke-width="2"/>
    <text x="157" y="404" class="section">12 V</text><text x="151" y="433" class="small">DC régulé</text>
    <circle cx="325" cy="355" r="13" fill="#e83b3b" class="port"/><circle cx="325" cy="500" r="13" fill="#20262c" stroke="#fff" stroke-width="2"/>
    <text x="205" y="361" class="label">+12 V</text><text x="215" y="506" class="label">GND</text>
    <text x="77" y="625" class="small">Alimente uniquement le monnayeur.</text>
  </g>

  <!-- Monnayeur -->
  <g filter="url(#shadow)">
    <rect x="445" y="165" width="475" height="570" rx="24" fill="url(#coin)" stroke="#8796a5" stroke-width="3"/>
    <rect x="480" y="200" width="405" height="90" rx="12" fill="#25313c"/>
    <text x="555" y="236" class="white" style="font:700 27px Arial,sans-serif">MONNAYEUR JY-133B</text>
    <text x="572" y="268" class="silk">SORTIE IMPULSIONNELLE COIN</text>
    <rect x="565" y="335" width="235" height="230" rx="16" fill="#dce3e8" stroke="#7c8995" stroke-width="2"/>
    <circle cx="682" cy="425" r="70" fill="#8996a1" stroke="#f7fafc" stroke-width="12"/>
    <path d="M682 369 V481" stroke="#20262c" stroke-width="19" stroke-linecap="round"/>
    <rect x="630" y="522" width="104" height="95" rx="13" fill="#aab5bd" stroke="#6e7b85" stroke-width="2"/>
    <circle cx="445" cy="330" r="12" fill="#e83b3b" class="port"/><circle cx="445" cy="430" r="12" fill="#20262c" stroke="#fff" stroke-width="2"/><circle cx="920" cy="570" r="12" fill="#31a8dc" class="port"/>
    <text x="472" y="336" class="label">ROUGE : +12 V</text><text x="472" y="436" class="label">NOIR : GND</text><text x="704" y="608" class="label">BLANC : COIN</text>
  </g>

  <!-- ESP32 central alimenté par USB -->
  <g filter="url(#shadow)">
    <rect x="1160" y="165" width="480" height="570" rx="30" fill="#fff" stroke="#c6d1dc" stroke-width="2"/>
    <text x="1275" y="215" class="section">ESP32 DEV MODULE</text>
    <rect x="1265" y="250" width="270" height="390" rx="22" fill="url(#board)" stroke="#083e61" stroke-width="4"/>
    <rect x="1320" y="285" width="160" height="150" rx="10" fill="#aeb8c0" stroke="#e5eaee" stroke-width="3"/>
    <text x="1352" y="350" class="white" style="font:700 25px Arial,sans-serif">ESP32</text><text x="1340" y="384" class="silk">CENTRALE</text>
    <rect x="1350" y="596" width="100" height="62" rx="8" fill="#c9cdd1" stroke="#7d858c" stroke-width="3"/>
    <rect x="1372" y="612" width="56" height="54" rx="5" fill="#6e747a"/>
    <circle cx="1160" cy="570" r="14" fill="#31a8dc" class="port"/><circle cx="1160" cy="680" r="14" fill="#20262c" stroke="#fff" stroke-width="2"/>
    <text x="1183" y="576" class="label">GPIO13</text><text x="1183" y="686" class="label">GND</text>
    <text x="1297" y="710" class="small">Alimentation séparée par USB</text>
  </g>

  <!-- Raccordements minimaux -->
  <path d="M325 355 H385 V330 H445" class="wire wire12"/>
  <path d="M325 500 H385 V430 H445" class="wire wireGnd"/>
  <path d="M385 500 V835 H1080 V680 H1160" class="wire wireGnd"/>
  <circle cx="385" cy="500" r="8" fill="#20262c" class="junction"/><circle cx="1080" cy="835" r="8" fill="#20262c" class="junction"/>
  <path d="M920 570 H1160" class="wire wireCoin"/>

  <!-- Le rappel est interne à l'ESP32 : aucune résistance externe vers GND. -->
  <rect x="1175" y="785" width="465" height="82" class="callout"/>
  <text x="1200" y="819" class="section">INPUT_PULLUP</text>
  <text x="1200" y="846" class="small">Rappel interne vers 3V3 · sans résistance externe vers GND</text>

  <rect x="455" y="785" width="420" height="82" class="callout"/>
  <text x="485" y="819" class="section">Masse commune</text>
  <text x="485" y="846" class="small">GND monnayeur, alimentation 12 V et ESP32 reliés ensemble.</text>

  <rect x="45" y="915" width="1595" height="88" class="warning"/>
  <text x="75" y="944" class="warningText">ATTENTION : ne jamais relier le +12 V au GPIO13. Le pull-up interne n'adapte pas une tension de 5 V ou 12 V.</text>
  <text x="75" y="970" class="small">Retirer toute résistance entre GPIO13 et GND. Le signal COIN doit être compatible 3,3 V ou passer par une interface adaptée.</text>
  <text x="75" y="993" class="small">Vérifier l’amplitude des impulsions avant raccordement. Couper les alimentations avant toute modification.</text>
</svg>
