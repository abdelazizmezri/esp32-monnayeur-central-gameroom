<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
  <title id="title">Câblage physique final de la centrale ESP32</title>
  <desc id="desc">Vue pratique inspirée d'un montage sur table : alimentation 12 volts, monnayeur JY-133B, convertisseur 5 volts, interface PC817 et ESP32. LittleFS et NVS sont internes et aucun module microSD n'est raccordé.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#e9eef5"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25282c"/><stop offset="1" stop-color="#080a0c"/></linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164a78"/><stop offset="1" stop-color="#0b2744"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2f5"/><stop offset="1" stop-color="#aeb9c4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#26384b" flood-opacity=".24"/></filter>
    <filter id="wireShadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#17202a" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#172536}.subtitle{font:16px Arial,sans-serif;fill:#53677d}.section{font:700 20px Arial,sans-serif;fill:#172536}.label{font:700 15px Arial,sans-serif;fill:#182635}.small{font:13px Arial,sans-serif;fill:#53677d}.tiny{font:11px Arial,sans-serif;fill:#66798d}.white{fill:#fff}.board-label{font:700 13px Arial,sans-serif;fill:#fff}.silk{font:11px Arial,sans-serif;fill:#e7edf3}.box{fill:#fff;stroke:#c6d1dc;stroke-width:2;rx:16;filter:url(#shadow)}.port{stroke:#13202c;stroke-width:2}.unused{fill:#6b7279;stroke:#c4c9cd;stroke-width:1}.wire{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#wireShadow)}.wire12{stroke:#e83b3b}.wire5{stroke:#f39b21}.wire33{stroke:#8a51d1}.wireGnd{stroke:#20262c}.wireCoin{stroke:#31a8dc}.wireOut{stroke:#27a85b}.junction{stroke:#fff;stroke-width:2}.callout{fill:#f7fafc;stroke:#c4d0dc;stroke-width:1.5;rx:10}.warning{fill:#fff7dd;stroke:#e1ad2c;stroke-width:2;rx:12}.warningText{font:700 14px Arial,sans-serif;fill:#775611}.memory{fill:#0c334d;stroke:#48bce8;stroke-width:1.5;rx:9}.memoryText{font:700 13px Arial,sans-serif;fill:#d8f5ff}
    </style>
  </defs>

  <rect width="1700" height="1050" fill="url(#page)"/>
  <rect x="0" y="0" width="1700" height="108" fill="#fff"/>
  <line x1="0" y1="108" x2="1700" y2="108" stroke="#d6dee7" stroke-width="2"/>
  <text x="50" y="48" class="title">Centrale PS TIME MANAGER — câblage physique final</text>
  <text x="50" y="79" class="subtitle">ESP32 Dev Module · monnayeur JY-133B 12 V · PC817 · alimentation 5 V · stockage LittleFS + NVS interne</text>
  <rect x="1270" y="25" width="380" height="58" class="warning"/>
  <text x="1290" y="49" class="warningText">Aucun module microSD / aucune liaison SPI</text>
  <text x="1290" y="70" class="small">GPIO13 est la seule entrée utilisée par le monnayeur.</text>

  <!-- Alimentation 12 V -->
  <g filter="url(#shadow)">
    <rect x="45" y="180" width="270" height="185" rx="18" fill="#fff" stroke="#c6d1dc" stroke-width="2"/>
    <rect x="45" y="180" width="270" height="48" rx="18" fill="#34495e"/>
    <rect x="45" y="210" width="270" height="18" fill="#34495e"/>
    <text x="70" y="211" class="board-label">ALIMENTATION 12 V DC</text>
    <rect x="76" y="254" width="110" height="78" rx="8" fill="#edf2f6" stroke="#9eabb7"/>
    <text x="91" y="282" class="label">230 V AC</text><text x="91" y="310" class="small">entrée secteur</text>
    <circle cx="286" cy="267" r="11" fill="#e83b3b" class="port"/><circle cx="286" cy="322" r="11" fill="#20262c" class="port"/>
    <text x="210" y="272" class="label">+12 V</text><text x="210" y="327" class="label">GND</text>
  </g>

  <!-- Monnayeur -->
  <g filter="url(#shadow)">
    <rect x="380" y="145" width="335" height="275" rx="20" fill="url(#coin)" stroke="#8796a5" stroke-width="2"/>
    <rect x="405" y="172" width="285" height="70" rx="10" fill="#25313c"/>
    <text x="432" y="203" class="white" style="font:700 21px Arial,sans-serif">MONNAYEUR JY-133B</text><text x="454" y="228" class="silk">SORTIE IMPULSIONNELLE NPN</text>
    <rect x="475" y="264" width="145" height="105" rx="8" fill="#dce3e8" stroke="#7c8995"/>
    <circle cx="548" cy="316" r="40" fill="#8996a1" stroke="#f7fafc" stroke-width="8"/>
    <circle cx="380" cy="231" r="10" fill="#e83b3b" class="port"/><circle cx="380" cy="286" r="10" fill="#20262c" class="port"/><circle cx="715" cy="366" r="10" fill="#31a8dc" class="port"/>
    <text x="398" y="235" class="label">ROUGE : +12 V</text><text x="398" y="290" class="label">NOIR : GND</text><text x="505" y="400" class="label">BLANC : COIN</text>
  </g>

  <!-- ESP32, inspiré de la vue physique de référence -->
  <g filter="url(#shadow)">
    <rect x="810" y="135" width="835" height="410" rx="30" fill="url(#board)" stroke="#454b50" stroke-width="4"/>
    <circle cx="850" cy="180" r="20" fill="#f7f8fa"/><circle cx="1604" cy="180" r="20" fill="#f7f8fa"/><circle cx="850" cy="500" r="20" fill="#f7f8fa"/><circle cx="1604" cy="500" r="20" fill="#f7f8fa"/>
    <rect x="792" y="282" width="65" height="115" rx="8" fill="#c9cdd1" stroke="#7d858c" stroke-width="3"/><rect x="804" y="304" width="41" height="72" rx="5" fill="#6e747a"/>
    <text x="817" y="425" class="silk" transform="rotate(-90 817 425)">USB</text>
    <rect x="1260" y="211" width="285" height="230" rx="9" fill="#30363b" stroke="#9aa2a8" stroke-width="2"/><rect x="1290" y="244" width="225" height="142" rx="4" fill="#899198"/>
    <text x="1322" y="300" class="white" style="font:700 25px Arial,sans-serif">ESP-WROOM-32</text><text x="1343" y="333" class="silk">Wi-Fi · Bluetooth</text>
    <path d="M1460 220 q42 28 0 56 q-42 28 0 56 q42 28 0 56" fill="none" stroke="#d1d6da" stroke-width="8" opacity=".55"/>
    <rect x="892" y="235" width="230" height="118" rx="13" fill="#11171c" stroke="#444e57"/>
    <text x="930" y="275" class="white" style="font:700 24px Arial,sans-serif">ESP32 CENTRAL</text><text x="937" y="306" class="silk">PS TIME MANAGER</text>
    <rect x="917" y="323" width="87" height="20" class="memory"/><text x="930" y="338" class="memoryText">NVS</text><rect x="1015" y="323" width="93" height="20" class="memory"/><text x="1024" y="338" class="memoryText">LittleFS</text>

    <g>
      <circle cx="885" cy="162" r="9" class="unused"/><circle cx="928" cy="162" r="9" class="unused"/><circle cx="971" cy="162" r="9" class="unused"/><circle cx="1014" cy="162" r="9" class="unused"/><circle cx="1057" cy="162" r="9" class="unused"/><circle cx="1100" cy="162" r="9" class="unused"/><circle cx="1143" cy="162" r="9" class="unused"/><circle cx="1186" cy="162" r="9" class="unused"/><circle cx="1229" cy="162" r="9" class="unused"/><circle cx="1272" cy="162" r="9" class="unused"/><circle cx="1315" cy="162" r="9" class="unused"/><circle cx="1358" cy="162" r="9" class="unused"/><circle cx="1401" cy="162" r="9" class="unused"/><circle cx="1444" cy="162" r="9" class="unused"/><circle cx="1487" cy="162" r="9" class="unused"/><circle cx="1530" cy="162" r="9" class="unused"/><circle cx="1573" cy="162" r="9" class="unused"/>
      <circle cx="885" cy="518" r="9" class="unused"/><circle cx="928" cy="518" r="9" class="unused"/><circle cx="971" cy="518" r="9" class="unused"/><circle cx="1014" cy="518" r="9" class="unused"/><circle cx="1057" cy="518" r="9" class="unused"/><circle cx="1100" cy="518" r="9" class="unused"/><circle cx="1143" cy="518" r="9" class="unused"/><circle cx="1186" cy="518" r="9" class="unused"/><circle cx="1229" cy="518" r="9" class="unused"/><circle cx="1272" cy="518" r="9" class="unused"/><circle cx="1315" cy="518" r="9" class="unused"/><circle cx="1358" cy="518" r="9" class="unused"/><circle cx="1401" cy="518" r="9" class="unused"/><circle cx="1444" cy="518" r="9" class="unused"/><circle cx="1487" cy="518" r="9" class="unused"/><circle cx="1530" cy="518" r="9" class="unused"/><circle cx="1573" cy="518" r="9" class="unused"/>
    </g>
    <circle cx="900" cy="518" r="13" fill="#f39b21" class="port"/><circle cx="960" cy="518" r="13" fill="#20262c" stroke="#fff" stroke-width="2"/><circle cx="1030" cy="518" r="13" fill="#27a85b" class="port"/><circle cx="1120" cy="518" r="13" fill="#8a51d1" class="port"/><circle cx="1200" cy="518" r="13" fill="#20262c" stroke="#fff" stroke-width="2"/>
    <text x="877" y="484" class="board-label">VIN/5V</text><text x="942" y="484" class="board-label">GND</text><text x="1001" y="484" class="board-label">GPIO13</text><text x="1102" y="484" class="board-label">3V3</text><text x="1183" y="484" class="board-label">GND</text>
  </g>
  <rect x="1060" y="556" width="530" height="47" class="callout"/><text x="1081" y="578" class="small">Vue de raccordement : repérer les noms sérigraphiés sur votre carte.</text><text x="1081" y="596" class="tiny">La position physique peut varier selon le fabricant du DevKit.</text>

  <!-- Convertisseur abaisseur -->
  <g filter="url(#shadow)">
    <rect x="370" y="475" width="345" height="210" rx="18" fill="url(#module)" stroke="#0c3458" stroke-width="3"/>
    <circle cx="455" cy="580" r="48" fill="#1670a6" stroke="#78c9ee" stroke-width="4"/><circle cx="455" cy="580" r="19" fill="#d9e4eb"/>
    <rect x="535" y="512" width="75" height="108" rx="8" fill="#202a32" stroke="#8a979f"/><rect x="625" y="527" width="54" height="75" rx="5" fill="#d1d8dc" stroke="#78838a"/>
    <text x="500" y="657" class="board-label">BUCK 12 V → 5 V / ≥ 1 A</text>
    <circle cx="370" cy="530" r="11" fill="#e83b3b" class="port"/><circle cx="370" cy="595" r="11" fill="#20262c" stroke="#fff" stroke-width="2"/><circle cx="715" cy="530" r="11" fill="#f39b21" class="port"/><circle cx="715" cy="595" r="11" fill="#20262c" stroke="#fff" stroke-width="2"/>
    <text x="387" y="535" class="board-label">IN+</text><text x="387" y="600" class="board-label">IN−</text><text x="650" y="510" class="board-label">OUT+</text><text x="650" y="625" class="board-label">OUT−</text>
  </g>
  <rect x="389" y="695" width="310" height="42" class="warning"/><text x="409" y="721" class="warningText">Régler la sortie à 5,0 V avant l’ESP32.</text>

  <!-- Interface PC817 -->
  <g filter="url(#shadow)">
    <rect x="755" y="735" width="500" height="230" rx="18" fill="#203e73" stroke="#0d2850" stroke-width="3"/>
    <text x="785" y="772" class="board-label" style="font-size:18px">INTERFACE DE PROTECTION PC817</text><line x1="1005" y1="790" x2="1005" y2="935" stroke="#79a2d1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="783" y="812" class="silk">CÔTÉ MONNAYEUR 12 V</text><text x="1030" y="812" class="silk">CÔTÉ ESP32 3,3 V</text>
    <circle cx="755" cy="835" r="11" fill="#e83b3b" class="port"/><circle cx="755" cy="905" r="11" fill="#31a8dc" class="port"/>
    <text x="777" y="840" class="board-label">+12 V</text><text x="777" y="910" class="board-label">COIN blanc</text>
    <rect x="842" y="821" width="72" height="28" rx="6" fill="#d8c38a" stroke="#725f30"/><text x="850" y="840" class="tiny" style="fill:#172536">R1 2,2 kΩ</text>
    <path d="M914 835 H950 L963 825 M950 835 L963 845" fill="none" stroke="#f6d55c" stroke-width="4"/><path d="M963 825 V905 H755" fill="none" stroke="#9edff5" stroke-width="3"/>
    <rect x="976" y="842" width="58" height="58" rx="10" fill="#171d22" stroke="#dfe7ec" stroke-width="2"/><text x="985" y="875" class="silk">PC817</text>
    <circle cx="1090" cy="735" r="11" fill="#8a51d1" class="port"/><circle cx="1160" cy="735" r="11" fill="#27a85b" class="port"/><circle cx="1230" cy="735" r="11" fill="#20262c" stroke="#fff" stroke-width="2"/>
    <text x="1068" y="828" class="board-label">R2 10 kΩ</text><path d="M1090 735 V845 H1160" fill="none" stroke="#b485e8" stroke-width="4"/><rect x="1098" y="832" width="58" height="26" rx="5" fill="#d8c38a" stroke="#725f30"/>
    <path d="M1034 860 H1160 V735 M1034 885 H1230 V735" fill="none" stroke="#dbe4ec" stroke-width="4"/>
    <text x="1069" y="718" class="label">3V3</text><text x="1143" y="718" class="label">OUT</text><text x="1213" y="718" class="label">GND</text>
  </g>

  <!-- Fils d'alimentation 12 V et masse primaire -->
  <path d="M286 267 H340 V231 H380" class="wire wire12"/><path d="M340 267 V530 H370" class="wire wire12"/><path d="M340 530 V705 H720 V835 H755" class="wire wire12"/>
  <circle cx="340" cy="267" r="7" fill="#e83b3b" class="junction"/><circle cx="340" cy="530" r="7" fill="#e83b3b" class="junction"/>
  <path d="M286 322 H355 V286 H380" class="wire wireGnd"/><path d="M355 322 V595 H370" class="wire wireGnd"/><circle cx="355" cy="322" r="7" fill="#20262c" class="junction"/>

  <!-- Signal monnayeur vers entrée PC817 -->
  <path d="M715 366 H735 V905 H755" class="wire wireCoin"/>

  <!-- Sortie 5 V du buck vers ESP32 -->
  <path d="M715 530 H900 V518" class="wire wire5"/><path d="M715 595 H960 V518" class="wire wireGnd"/>

  <!-- Sortie protégée PC817 vers ESP32 -->
  <path d="M1090 735 V680 H1120 V518" class="wire wire33"/><path d="M1160 735 V650 H1030 V518" class="wire wireOut"/><path d="M1230 735 V620 H1200 V518" class="wire wireGnd"/>

  <!-- Légende et consignes -->
  <g>
    <rect x="1300" y="650" width="350" height="315" class="box"/>
    <text x="1330" y="689" class="section">Couleurs des fils</text>
    <rect x="1333" y="714" width="50" height="8" rx="4" fill="#e83b3b"/><text x="1400" y="724" class="label">+12 V</text>
    <rect x="1333" y="754" width="50" height="8" rx="4" fill="#f39b21"/><text x="1400" y="764" class="label">5 V vers VIN</text>
    <rect x="1333" y="794" width="50" height="8" rx="4" fill="#8a51d1"/><text x="1400" y="804" class="label">3,3 V pull-up</text>
    <rect x="1333" y="834" width="50" height="8" rx="4" fill="#31a8dc"/><text x="1400" y="844" class="label">COIN brut</text>
    <rect x="1333" y="874" width="50" height="8" rx="4" fill="#27a85b"/><text x="1400" y="884" class="label">OUT protégé → GPIO13</text>
    <rect x="1333" y="914" width="50" height="8" rx="4" fill="#20262c"/><text x="1400" y="924" class="label">GND</text>
    <text x="1330" y="951" class="tiny">Les couleurs physiques peuvent différer :</text><text x="1330" y="968" class="tiny">toujours vérifier les étiquettes et mesurer.</text>
  </g>

  <rect x="45" y="990" width="1605" height="42" class="warning"/>
  <text x="65" y="1017" class="warningText">Sécurité : ne jamais relier COIN directement au GPIO13 · confirmer le type de sortie du monnayeur · couper l’alimentation avant tout câblage · réglage secteur par une personne qualifiée.</text>
</svg>
